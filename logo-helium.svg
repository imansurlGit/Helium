<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Logo Helium</title>
  <desc id="desc">Symbole rouge avec texte HELIUM et baseline IMPULSER LE CHANGEMENT</desc>
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e25b5b" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <polygon points="256,78 208,126 224,142 256,110 288,142 304,126" fill="url(#redGrad)" />
    <polygon points="256,128 224,160 240,176 256,160 272,176 288,160" fill="url(#redGrad)" />
    <polygon points="156,152 116,192 132,208 172,168" fill="url(#redGrad)" />
    <polygon points="356,152 340,168 380,208 396,192" fill="url(#redGrad)" />
  </g>

  <text x="256" y="286" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" letter-spacing="2" fill="#101319" font-weight="700">HELIUM</text>
  <text x="256" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" letter-spacing="1" fill="#c62828" font-weight="700">IMPULSER LE CHANGEMENT</text>
</svg>
